<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil</title>
  <link rel="stylesheet" href="profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
  <button id="backBtn" class="back-button">←</button>
  <div class="profile-container">
    <h1>My Profile</h1>
    <div class="profile-photo-section">
      <label for="uploadPhoto" class="photo-label">
        <img id="profilePhoto" src="default.jpg" alt="Profile Photo" />
        <input type="file" id="uploadPhoto" accept="image/*" hidden />
        <i class="fa fa-pencil edit-icon" id="editUsernameBtn" title="Edit Username"></i>
      </label>
      <p id="usernameDisplay">Username</p>
    </div>

    <div class="action-buttons">
      <button class="small-btn" id="resetPasswordBtn">🔐 Reset Password</button>
      <button class="small-btn" id="deleteAccountBtn">🔒 Delete Account</button>
      <button class="small-btn" id="logoutBtn">🔓 Logout</button>
    </div>
  </div>

  <script src="profile.js"></script>
</body>
</html>
