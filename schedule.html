<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule</title>
  <link rel="stylesheet" href="style.css" />
  <div class="top-bar">
    <button onclick="goBack()">⟵</button>
  </div>
  <style>
    body {
      background-color: #0c2f4c;
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    .top-bar {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 1rem;
    }


    .top-bar button {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 12px;
      background-color: #1d3b5b;
    }

    .form-title {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }

    .schedule-form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .schedule-form input,
    .schedule-form select {
      padding: 0.6rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      min-width: 120px;
    }

    .add-btn {
      padding: 0.6rem 1rem;
      background-color: #5a73fc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .schedule-list {
      margin-top: 1rem;
    }

    .schedule-item {
      background-color: #284e70;
      margin: 0.5rem 0;
      padding: 1rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-title">Add Schedule</div>
    <div class="schedule-form">
      <select id="day">
        <option disabled selected>Day</option>
        <option value="Senin">Senin</option>
        <option value="Selasa">Selasa</option>
        <option value="Rabu">Rabu</option>
        <option value="Kamis">Kamis</option>
        <option value="Jumat">Jumat</option>
        <option value="Sabtu">Sabtu</option>
        <option value="Minggu">Minggu</option>
      </select>
      <input type="time" id="startTime" />
      <input type="time" id="endTime" />
      <input type="text" id="course" placeholder="Course Name" />
      <button class="add-btn" onclick="addSchedule()">＋</button>
    </div>
    <div id="scheduleList" class="schedule-list"></div>
  </div>

  <script src="schedule.js"></script>
</body>
</html>
